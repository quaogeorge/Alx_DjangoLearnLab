<h1>Books</h1>
<ul>
{% for b in books %}
  <li><a href="{% url 'book-detail' b.pk %}">{{ b.title }}</a>
    — <a href="{% url 'book-edit' b.pk %}">edit</a>
    — <a href="{% url 'book-delete' b.pk %}">delete</a>
  </li>
{% empty %}
  <li>No books yet.</li>
{% endfor %}
</ul>
<a href="{% url 'book-add' %}">Add book</a>

{% for book in books %}
  <div class="book">
    <h3>{{ book.title }}</h3>            {# auto-escaped #}
    <p>Author: {{ book.author }}</p>
  </div>
{% endfor %}
