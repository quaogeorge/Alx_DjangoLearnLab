{# blog/templates/blog/comment_form.html #}
{% extends "blog/base.html" %}
{% block content %}
  <h1>New comment</h1>
  <form method="post">{% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Post comment</button>
  </form>
  <p><a href="{{ view.post.get_absolute_url }}">Back to post</a></p>
{% endblock %}
