{% extends "blog/base.html" %}
{% block title %}Edit profile{% endblock %}
{% block content %}
  <h1>Edit profile</h1>
  <form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    <label>Email</label>
    <input type="email" name="email" value="{{ user.email }}">
    {{ form.as_p }}
    <button type="submit">Save</button>
  </form>
{% endblock %}
